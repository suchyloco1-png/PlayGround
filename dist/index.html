<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramp Rush: Airport Tycoon</title>
  <style>
    :root {
      --sky: #bfe7ff;
      --grass: #7bc96f;
      --asphalt: #4d525a;
      --panel: rgba(15, 22, 35, 0.78);
      --gold: #ffd267;
      --danger: #ff6b6b;
      --success: #7ee081;
      --warning: #e6be51;
      --text: #edf2ff;
      --muted: #b8c4de;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#bce8ff, #dff6ff 30%, #d7f0cf 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      position: relative;
      width: min(100vw, 1400px);
      height: min(100vh, 850px);
      background: linear-gradient(#99d8ff 0%, #cfefff 30%, #b7dc7a 65%, #7bbd66 100%);
      box-shadow: 0 30px 45px rgba(0,0,0,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      overflow: hidden;
      border-radius: 16px;
    }

    .hud { position: absolute; inset: 0; pointer-events: none; }

    .topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      z-index: 10;
    }

    .title-box, .stats-box, .command-box, .task-box, .message-box {
      background: var(--panel);
      backdrop-filter: blur(7px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      box-shadow: var(--shadow) 0 8px 20px;
    }

    .title-box {
      padding: 10px 16px;
      min-width: 220px;
    }

    .title-box h1 {
      margin: 0;
      font-size: clamp(20px, 2vw, 32px);
      letter-spacing: 1px;
    }

    .title-box .sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats-box {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 10px;
      padding: 10px 14px;
      min-width: 360px;
    }

    .stat {
      text-align: center;
      padding: 4px 8px;
    }

    .stat .label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .stat .value {
      font-size: clamp(18px, 1.5vw, 28px);
      font-weight: 700;
    }

    .command-box {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 260px;
      padding: 14px 16px;
      z-index: 12;
      pointer-events: auto;
    }

    .command-box h3 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(#4f9ae7, #2f7cd6);
      color: white;
      font-weight: 700;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
    }

    button:active { transform: translateY(1px); }
    button.secondary { background: linear-gradient(#526370, #3a4a5c); }
    button.warning { background: linear-gradient(#f1b25f, #d8881a); }

    .task-box {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: min(380px, calc(100vw - 320px));
      padding: 12px 16px;
      z-index: 12;
      pointer-events: none;
    }

    .task-box h3 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .task-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .task-bar {
      height: 11px;
      border-radius: 99px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      margin-top: 8px;
    }

    .task-fill {
      height: 100%;
      background: linear-gradient(90deg, #7ee081, #6ed7d6);
      width: 0%;
      transition: width .2s ease;
    }

    .message-box {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      z-index: 15;
      min-width: 220px;
      text-align: center;
      font-weight: 700;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
    }

    .message-box.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #world { position: absolute; inset: 0; z-index: 1; }
    canvas { width: 100%; height: 100%; display: block; background: transparent; }

    @media (max-width: 900px) {
      #game {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      .topbar { top: 10px; left: 10px; right: 10px; }
      .stats-box { min-width: 0; }
      .command-box { width: 220px; }
      .task-box { width: 280px; }
    }

    @media (max-width: 620px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .stats-box {
        grid-template-columns: repeat(2, 1fr);
      }

      .command-box {
        left: 10px;
        right: 10px;
        width: auto;
        bottom: 10px;
      }

      .task-box {
        right: 10px;
        left: 10px;
        bottom: 138px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="topbar">
        <div class="title-box">
          <div class="sub">Airport operations</div>
          <h1>Ramp Rush</h1>
        </div>
        <div class="stats-box">
          <div class="stat"><span class="label">Cash</span><span class="value" id="cashValue">$0</span></div>
          <div class="stat"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
          <div class="stat"><span class="label">Day</span><span class="value" id="dayValue">1</span></div>
          <div class="stat"><span class="label">Flights</span><span class="value" id="flightValue">0</span></div>
        </div>
      </div>

      <div class="message-box" id="messageBox">Task started</div>

      <div class="command-box">
        <h3>Ground Crew</h3>
        <div class="controls">
          <button id="startTaskBtn">Start task</button>
          <button id="advanceBtn" class="secondary">Next turn</button>
          <button id="pauseBtn" class="secondary">Pause</button>
          <button id="resetBtn" class="warning">Reset</button>
        </div>
      </div>

      <div class="task-box">
        <h3>Current task</h3>
        <div class="task-title">
          <span id="taskName">Loading check</span>
          <span id="taskStatus">Ready</span>
        </div>
        <div id="taskDescription">Prepare the bay for arriving aircraft.</div>
        <div class="task-bar"><div class="task-fill" id="taskFill"></div></div>
      </div>
    </div>

    <div id="world"></div>
  </div>

  <script>
    const world = document.getElementById('world');
    const cashValue = document.getElementById('cashValue');
    const scoreValue = document.getElementById('scoreValue');
    const dayValue = document.getElementById('dayValue');
    const flightValue = document.getElementById('flightValue');
    const taskName = document.getElementById('taskName');
    const taskStatus = document.getElementById('taskStatus');
    const taskDescription = document.getElementById('taskDescription');
    const taskFill = document.getElementById('taskFill');
    const messageBox = document.getElementById('messageBox');

    const startTaskBtn = document.getElementById('startTaskBtn');
    const advanceBtn = document.getElementById('advanceBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const taskCatalog = [
      { id: 'loading', name: 'Loading check', desc: 'Inspect baggage carts and clear the lane for the next arrival.', target: 0.8, reward: 120 },
      { id: 'tow', name: 'Tow tug', desc: 'Connect the tug and position the aircraft at the gate.', target: 0.82, reward: 170 },
      { id: 'fuel', name: 'Fuel monitor', desc: 'Verify fuel lines and mark the aircraft service-ready.', target: 0.9, reward: 210 },
      { id: 'catering', name: 'Catering run', desc: 'Deliver catering and open cabin service access.', target: 0.88, reward: 240 },
      { id: 'turnaround', name: 'Turnaround', desc: 'Complete the rotation before the departure window closes.', target: 1, reward: 320 }
    ];

    const state = {
      cash: 2600,
      score: 0,
      day: 1,
      time: 0,
      paused: false,
      currentTaskIndex: 0,
      taskProgress: 0,
      activeTask: null,
      flights: [],
      messageTimer: 0
    };

    function cloneFlight(entry) {
      return {
        ...entry,
        progress: 0,
        active: false,
        heading: entry.heading || 1,
        yOffset: Math.random() * 20
      };
    }

    function seedFlights() {
      state.flights = [
        { id: 'A320', bay: 0, x: 100, y: 160, w: 170, h: 76, body: '#dfe8f4', accent: '#6b7a90', status: 'arriving', heading: 1, isReady: false },
        { id: 'B737', bay: 1, x: 470, y: 250, w: 185, h: 80, body: '#f2e3cb', accent: '#9d7c54', status: 'boarding', heading: 1, isReady: true },
        { id: 'E190', bay: 2, x: 845, y: 205, w: 170, h: 72, body: '#cfe3ff', accent: '#5b7dc7', status: 'departing', heading: -1, isReady: false }
      ];
    }

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.classList.add('visible');
      clearTimeout(showMessage._timer);
      showMessage._timer = setTimeout(() => messageBox.classList.remove('visible'), 1450);
    }

    function setTask(index) {
      state.currentTaskIndex = index;
      state.activeTask = taskCatalog[index];
      state.taskProgress = 0;
      taskName.textContent = state.activeTask.name;
      taskDescription.textContent = state.activeTask.desc;
      taskStatus.textContent = 'In progress';
      taskFill.style.width = '0%';
      showMessage(state.activeTask.name + ' started');
    }

    function completeTask() {
      if (!state.activeTask) return;
      const reward = state.activeTask.reward;
      state.cash += reward;
      state.score += reward;
      state.day += 1;
      dayValue.textContent = state.day;
      cashValue.textContent = '$' + Math.round(state.cash);
      scoreValue.textContent = Math.round(state.score);
      flightValue.textContent = state.flights.length;

      const doneIndex = (state.currentTaskIndex + 1) % taskCatalog.length;
      state.activeTask = null;
      taskStatus.textContent = 'Completed';
      taskFill.style.width = '100%';
      showMessage('Turnaround complete! +$' + reward);

      const activeFlight = state.flights[Math.floor(Math.random() * state.flights.length)];
      if (activeFlight) {
        activeFlight.isReady = true;
        activeFlight.status = 'departing';
        activeFlight.heading = -1;
      }

      setTimeout(() => {
        setTask(doneIndex);
      }, 700);
    }

    function tickTask() {
      if (!state.activeTask || state.paused) return;
      state.taskProgress += 0.015;
      const target = state.activeTask.target;
      const pct = Math.min((state.taskProgress / target) * 100, 100);
      taskFill.style.width = pct + '%';
      if (state.taskProgress >= target) {
        completeTask();
      }
    }

    function updateHud() {
      cashValue.textContent = '$' + Math.round(state.cash);
      scoreValue.textContent = Math.round(state.score);
      dayValue.textContent = state.day;
      flightValue.textContent = state.flights.length;
    }

    function drawBlockyWorker(x, y, color, accent, dir) {
      const scale = 1.2;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 12 * scale, 12 * scale);
      ctx.fillStyle = '#2f2a2a';
      ctx.fillRect(2 * scale, 12 * scale, 3 * scale, 10 * scale);
      ctx.fillRect(7 * scale, 12 * scale, 3 * scale, 10 * scale);
      ctx.fillStyle = accent;
      ctx.fillRect(2 * scale, 2 * scale, 8 * scale, 8 * scale);
      ctx.fillStyle = '#fff';
      ctx.fillRect(2 * scale, 2 * scale, 2 * scale, 2 * scale);
      ctx.fillRect(6 * scale, 2 * scale, 2 * scale, 2 * scale);
      ctx.restore();
    }

    function drawFlight(flight, index) {
      const x = flight.x + Math.sin(state.time * 0.9 + index) * 14;
      const y = flight.y + Math.sin(state.time * 1.2 + index * 2) * 5 + flight.yOffset;
      ctx.save();
      ctx.translate(x, y);
      if (flight.heading < 0) {
        ctx.scale(-1, 1);
        ctx.translate(-flight.w, 0);
      }

      ctx.fillStyle = flight.body;
      ctx.fillRect(0, 12, flight.w, flight.h - 18);
      ctx.fillStyle = flight.accent;
      ctx.fillRect(30, 0, flight.w - 60, 18);
      ctx.fillStyle = '#dfe8f4';
      ctx.fillRect(15, 26, 32, 18);
      ctx.fillRect(flight.w - 52, 26, 28, 18);
      ctx.fillStyle = '#73829b';
      ctx.fillRect(0, 14, 15, 10);
      ctx.fillRect(flight.w - 15, 14, 15, 10);
      ctx.fillStyle = '#273444';
      ctx.fillRect(18, 10, 8, 8);
      ctx.fillRect(flight.w - 28, 10, 8, 8);
      ctx.fillStyle = flight.isReady ? '#4ad373' : '#f3c15a';
      ctx.fillRect(34, flight.h - 10, 64, 8);
      ctx.restore();

      if (flight.status === 'boarding' || flight.status === 'arriving') {
        drawBlockyWorker(x + flight.w * 0.35, y + 42, '#7ac95a', '#285a2a', 1);
        drawBlockyWorker(x + flight.w * 0.58, y + 44, '#82b4ff', '#2a4a72', 1);
      } else {
        drawBlockyWorker(x + flight.w * 0.45, y + 36, '#7ac95a', '#285a2a', -1);
      }
    }

    function drawRunway() {
      const { width, height } = worldCanvas;
      ctx.clearRect(0, 0, width, height);

      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, '#b6e5ff');
      sky.addColorStop(0.45, '#d9f5ff');
      sky.addColorStop(0.7, '#d7f0c7');
      sky.addColorStop(1, '#66a65c');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#7ec86d';
      ctx.fillRect(0, 520, width, height - 520);

      ctx.fillStyle = '#4e5458';
      ctx.fillRect(0, 470, width, 90);

      ctx.fillStyle = '#dfeaf3';
      ctx.fillRect(190, 490, 820, 18);
      ctx.fillStyle = '#eef4fb';
      for (let i = 0; i < 15; i++) {
        ctx.fillRect(70 + i * 78, 514, 38, 8);
      }

      ctx.fillStyle = '#7d8d9d';
      ctx.fillRect(40, 570, 1120, 22);

      ctx.fillStyle = '#5d7a56';
      ctx.fillRect(0, 600, width, 180);

      for (let i = 0; i < 3; i++) {
        const x = 120 + i * 380;
        ctx.fillStyle = '#d8dfe9';
        ctx.fillRect(x, 300, 170, 120);
        ctx.fillStyle = '#9aa8ae';
        ctx.fillRect(x + 16, 320, 138, 90);
        ctx.fillStyle = '#5f7c89';
        ctx.fillRect(x + 48, 332, 80, 18);
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 18px Arial';
        ctx.fillText('Bay ' + (i + 1), x + 62, 290);

        ctx.fillStyle = (i === 1) ? '#ffb237' : '#4ad373';
        ctx.fillRect(x + 28, 342, 105, 18);
      }

      for (let i = 0; i < state.flights.length; i++) {
        drawFlight(state.flights[i], i);
      }

      // tower and cargo carts
      ctx.fillStyle = '#31404d';
      ctx.fillRect(1000, 610, 105, 34);
      ctx.fillStyle = '#c7d6e2';
      ctx.fillRect(1015, 622, 72, 8);

      ctx.fillStyle = '#976f37';
      ctx.fillRect(210, 430, 42, 22);
      ctx.fillRect(250, 430, 42, 22);
      ctx.fillRect(122, 430, 42, 22);
    }

    function updateFlights() {
      state.flights.forEach((flight, index) => {
        if (flight.status === 'arriving') {
          flight.x += 0.6;
          if (flight.x > 120 + index * 380) flight.x = 120 + index * 380;
          if (flight.x >= 120 + index * 380) flight.status = 'boarding';
        }

        if (flight.status === 'departing') {
          flight.x -= 0.8;
          if (flight.x < -220) {
            flight.x = 1200;
            flight.status = 'arriving';
            flight.isReady = false;
          }
        }
      });
    }

    function loop() {
      state.time += 0.016;
      if (!state.paused) {
        tickTask();
        updateFlights();
      }
      drawRunway();
      requestAnimationFrame(loop);
    }

    startTaskBtn.addEventListener('click', () => {
      if (state.activeTask) {
        showMessage('Task already active');
        return;
      }
      setTask(state.currentTaskIndex % taskCatalog.length);
    });

    advanceBtn.addEventListener('click', () => {
      state.day += 1;
      state.cash += 90;
      updateHud();
      showMessage('Shift advanced');
      if (!state.activeTask) {
        setTask((state.currentTaskIndex + 1) % taskCatalog.length);
      }
    });

    pauseBtn.addEventListener('click', () => {
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
      taskStatus.textContent = state.paused ? 'Paused' : (state.activeTask ? 'In progress' : 'Ready');
      showMessage(state.paused ? 'Paused' : 'Running');
    });

    resetBtn.addEventListener('click', () => {
      state.cash = 2600;
      state.score = 0;
      state.day = 1;
      state.time = 0;
      state.paused = false;
      state.activeTask = null;
      state.currentTaskIndex = 0;
      state.taskProgress = 0;
      pauseBtn.textContent = 'Pause';
      taskStatus.textContent = 'Ready';
      taskFill.style.width = '0%';
      taskName.textContent = taskCatalog[0].name;
      taskDescription.textContent = taskCatalog[0].desc;
      seedFlights();
      updateHud();
      showMessage('Airport reset');
    });

    const worldCanvas = document.createElement('canvas');
    worldCanvas.width = 1200;
    worldCanvas.height = 850;
    world.appendChild(worldCanvas);
    const ctx = worldCanvas.getContext('2d');

    seedFlights();
    updateHud();
    setTask(0);
    taskStatus.textContent = 'Ready';
    loop();
  </script>
</body>
</html>
